<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Narrações</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2235; --card2:#222c44; --line:#2e3a57;
    --txt:#e8edf7; --muted:#9aa7c2; --accent:#2e9e3f; --accent2:#ffd700;
    --danger:#e0556b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,#0f1420,#141b2c);color:var(--txt);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:24px;margin:8px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
  input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit}
  textarea{min-height:110px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  .voices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .voice{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px 10px;
    text-align:center;cursor:pointer;transition:.15s;user-select:none}
  .voice:hover{border-color:var(--muted)}
  .voice.sel{border-color:var(--accent);background:#1c3326}
  .voice .nm{font-weight:700;font-size:15px}
  .voice .ds{font-size:12px;color:var(--muted);margin-top:3px}
  .offers{display:flex;flex-direction:column;gap:8px}
  .offer{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    cursor:pointer;font-size:14px;line-height:1.45;transition:.15s}
  .offer:hover{border-color:var(--muted)}
  .offer.sel{border-color:var(--accent2);background:#2c2a16}
  .offer .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent2);margin-right:6px;text-transform:uppercase}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row > *{flex:1}
  button{background:var(--accent);color:#fff;border:none;border-radius:11px;padding:15px;
    font-size:16px;font-weight:700;cursor:pointer;transition:.15s;width:100%}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .mini{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .key-row{display:flex;gap:8px}
  .key-row input{flex:1}
  .key-row button{width:auto;padding:12px 16px;font-size:14px;background:var(--card2);border:1px solid var(--line)}
  audio{width:100%;margin-top:14px}
  .status{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
  .status.show{display:block}
  .status.ok{background:#16331f;color:#7fd897;border:1px solid #2e9e3f}
  .status.err{background:#331620;border:1px solid var(--danger);color:#f3a4b3}
  .status.load{background:#1c2740;color:#9cc2ff;border:1px solid #3a5a9a}
  .dl{display:inline-block;margin-top:10px;color:var(--accent2);text-decoration:none;font-weight:600;font-size:14px}
  .flag{font-size:13px}
  details{margin-top:6px}
  summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ Gerador de Narrações</h1>
  <div class="sub">Selecione a voz e a oferta (ou escreva a sua), gere e baixe o áudio.</div>

  <!-- VOZ -->
  <div class="card">
    <label>Voz</label>
    <div class="voices" id="voices"></div>
  </div>

  <!-- CIDADE -->
  <div class="card">
    <label>Cidade</label>
    <input id="cidade" type="text" placeholder="Ex: Rio Claro" oninput="refreshPreview()">
    <div class="mini">A cidade entra no lugar de <b>{cidade}</b> nas ofertas prontas.</div>
  </div>

  <!-- OFERTA -->
  <div class="card">
    <label>Oferta</label>
    <div class="offers" id="offers"></div>
    <div style="margin-top:14px">
      <label>Texto final (edite à vontade)</label>
      <textarea id="texto" placeholder="Selecione uma oferta acima ou escreva a sua narração aqui..." oninput="markCustom()"></textarea>
    </div>
  </div>

  <!-- GERAR -->
  <div class="card">
    <button id="gen" onclick="generate()">Gerar narração</button>
    <div id="status" class="status"></div>
    <audio id="player" controls style="display:none"></audio>
    <a id="dl" class="dl" style="display:none" download>⬇️ Baixar MP3</a>
  </div>
</div>

<script>
const EL_KEY = "sk_f3321457bfacf6b00646079659bd1572ed1d7411595b4b9f";
const VOICES = [
  {id:"XiPS9cXxAVbaIWtGDHDh", nm:"Brittney", ds:"feminina"},
  {id:"MLytmMLa1SwNH7fHWYxE", nm:"Thomaz K", ds:"masculina"},
  {id:"rpNe0HOx7heUulPiOEaG", nm:"Locutor",  ds:"Diego"},
  {id:"ohZOfA9iwlZ5nOsoY7LB", nm:"Roberta",  ds:"feminina · casual"},
];
const OFFERS = [
  {tag:"Padrão", txt:"Em {cidade}, agora é diferente! Você ganha o aparelho, documentação, raio-X e um super clareamento. Clique no botão abaixo e garanta a sua vaga."},
  {tag:"Mensalidade", txt:"Em {cidade}, agora é diferente! Você ganha o aparelho, documentação e um super clareamento. Pagando apenas as mensalidades. Clique no botão abaixo e garanta a sua vaga."},
  {tag:"Atenção", txt:"Atenção {cidade}! Só hoje você recebe o aparelho, documentação, clareamento e diversos benefícios. As vagas são limitadas. Clique no botão abaixo e garanta a sua vaga."},
  {tag:"Benefícios", txt:"Em {cidade}, agora é diferente. Você ganha o aparelho e diversos benefícios e você só paga a mensalidade. Clique no link e garanta a sua vaga."},
];

let selVoice = VOICES[0].id;
let selOffer = -1;
let customEdited = false;

// monta vozes
const vc = document.getElementById('voices');
VOICES.forEach((v,i)=>{
  const el=document.createElement('div');
  el.className='voice'+(i===0?' sel':'');
  el.innerHTML=`<div class="nm">${v.nm}</div><div class="ds">${v.ds}</div>`;
  el.onclick=()=>{selVoice=v.id;document.querySelectorAll('.voice').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')};
  vc.appendChild(el);
});

// monta ofertas
const oc = document.getElementById('offers');
OFFERS.forEach((o,i)=>{
  const el=document.createElement('div');
  el.className='offer';
  el.innerHTML=`<span class="tag">${o.tag}</span>${o.txt}`;
  el.onclick=()=>{selOffer=i;customEdited=false;document.querySelectorAll('.offer').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');refreshPreview()};
  oc.appendChild(el);
});

function applyCity(t){
  const c=document.getElementById('cidade').value.trim();
  return t.replace(/\{cidade\}/g, c||"{cidade}");
}
function refreshPreview(){
  if(selOffer>=0 && !customEdited){
    document.getElementById('texto').value = applyCity(OFFERS[selOffer].txt);
  }
}
function markCustom(){ customEdited=true; selOffer=-1; document.querySelectorAll('.offer').forEach(x=>x.classList.remove('sel')); }

function setStatus(cls,msg){
  const s=document.getElementById('status');
  s.className='status show '+cls; s.textContent=msg;
}

async function generate(){
  const key=EL_KEY;
  const text=document.getElementById('texto').value.trim();
  if(!text){setStatus('err','Escreva ou selecione uma oferta.');return;}
  if(text.includes('{cidade}')){setStatus('err','Preencha o campo Cidade (ou remova {cidade} do texto).');return;}

  const btn=document.getElementById('gen'); btn.disabled=true;
  setStatus('load','Gerando áudio... aguarde ⏳');
  document.getElementById('player').style.display='none';
  document.getElementById('dl').style.display='none';
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${selVoice}`,{
      method:'POST',
      headers:{'xi-api-key':key,'Content-Type':'application/json'},
      body:JSON.stringify({text:text,model_id:'eleven_multilingual_v2',
        voice_settings:{stability:0.4,similarity_boost:0.8}})
    });
    if(!r.ok){
      let msg='Erro '+r.status;
      try{const j=await r.json();msg=(j.detail&&(j.detail.message||j.detail))||msg;}catch(e){}
      if(r.status===401)msg='Chave inválida ou sem permissão.';
      setStatus('err',typeof msg==='string'?msg:JSON.stringify(msg));btn.disabled=false;return;
    }
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const p=document.getElementById('player');
    p.src=url; p.style.display='block';
    const city=document.getElementById('cidade').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_')||'narracao';
    const vname=VOICES.find(v=>v.id===selVoice).nm.toLowerCase().replace(/[^a-z]/g,'');
    const dl=document.getElementById('dl');
    dl.href=url; dl.download=`narracao_${city}_${vname}.mp3`; dl.style.display='inline-block';
    setStatus('ok','Pronto! Ouça acima e baixe o MP3. ✓');
  }catch(e){
    setStatus('err','Falha de rede: '+e.message);
  }
  btn.disabled=false;
}
</script>
</body>
</html>
